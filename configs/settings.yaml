# Main configuration file - edit this file to change tickers, sources and data paths
app:
  name: financial-research-platform
  version: 0.1.0
  environment: development

watchlist:
  sectors:
    semiconductors:
      tickers: ["NVDA", "AMD", "INTC"]
      description: "Semiconductor sector - initial POC"

ingestion:
  news:
    source: "yfinance"
    update_mode: "append"

  prices:
    source: "yfinance"
    interval: "1d"

data:
  raw_path: "data/raw"
  processed_path: "data/processed"
