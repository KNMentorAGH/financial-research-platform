# Logging configuration - controls how and what the application logs

version: 1
disable_existing_loggers: false

# How each log line looks: 2026-01-01 12:00:00 [INFO] ingestion.runner: Fetching NVDA news
formatters:
  standard:
    format: "%(asctime)s [%(levelname)s] %(name)s: %(message)s"

# Where logs go - currently only console
handlers:
  console:
    class: logging.StreamHandler
    formatter: standard
    stream: ext://sys.stdout

# TODO: add file handler to save logs to logs/pipeline.log

root:
  level: INFO
  handlers: [console]
